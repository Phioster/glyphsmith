name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          retention-days: 1
          path: app/build/reports/tests/

      - name: Static analysis (detekt)
        run: gradle detekt --no-daemon --stacktrace

      - name: Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Upload analysis reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          retention-days: 1
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-*.*
          if-no-files-found: warn

      # Build-health check. The APK is not uploaded here — installs come from release.yml,
      # which publishes a rolling "dev" release instead of eating the artifact quota.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # The instrumented tests are not run here — that needs an emulator and a quarter of an
      # hour — but they are compiled, which costs seconds. Without this, a misspelling in them
      # is found by the emulator run on main, after the merge. It has happened twice.
      - name: Compile the instrumented tests
        run: gradle assembleDebugAndroidTest --no-daemon --stacktrace
