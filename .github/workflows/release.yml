name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      # The signing key never touches this runner. It lives only on the
      # maintainer's device, so CI builds the release APK debug-signed and
      # tools/sign-release.sh replaces the signature locally before publishing.
      # A key that exists in two places is a key that can leak from two places.
      - name: Build release APK (debug-signed, to be re-signed locally)
        run: gradle assembleRelease --no-daemon --stacktrace

      # Proof rather than trust, inverted: this APK must NOT carry the release
      # key, because the release key is not supposed to be reachable from here.
      # If it ever is, something leaked and the build should stop.
      - name: Verify the release key was NOT used here
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$SIGNER"
          if echo "$SIGNER" | grep -q "CN=Glyphsmith"; then
            echo "::error::the release key reached CI — it must only exist on the maintainer's device"
            exit 1
          fi
          echo "debug-signed as expected; sign locally with tools/sign-release.sh"

      - name: Stage APK
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "out/glyphsmith-${VERSION}.apk"

      # No automatic publishing any more: the APK leaving here is debug-signed
      # and must not be mistaken for a release. Download it, run
      # tools/sign-release.sh, and that script publishes the signed one.
      - name: Upload unsigned-for-release APK
        uses: actions/upload-artifact@v4
        with:
          name: glyphsmith-apk-debug-signed
          retention-days: 7
          path: out/*.apk
