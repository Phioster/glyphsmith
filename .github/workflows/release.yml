name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      # The signing key never exists in the repository. It is decoded from a secret into the
      # runner's workspace for this job only, and the path is what tells build.gradle.kts to use
      # the release signing config at all — without it a release build falls back to debug
      # signing, which is what a local build gets.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set — refusing to publish a debug-signed release"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Proof rather than trust: a release signed with the debug key would install and run
      # perfectly, and the only way to notice would be to check. The debug key's owner string is
      # the giveaway, so the build fails if it appears.
      - name: Verify the APK is signed with the release key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -20)
          echo "$SIGNER"
          if echo "$SIGNER" | grep -q "CN=Android Debug"; then
            echo "::error::this APK is debug-signed"
            exit 1
          fi

      - name: Stage APK
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "out/glyphsmith-${VERSION}.apk"

      # Tags only. There is a single branch, so there is nothing for a per-branch build channel to
      # collect — a build worth keeping is a build worth tagging.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # A manual run still produces an APK to download from the run itself, so a build can be
      # tested before it is tagged — it just does not become a release.
      - name: Upload APK for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: glyphsmith-apk
          retention-days: 7
          path: out/*.apk
