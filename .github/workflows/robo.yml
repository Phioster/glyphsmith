name: Robo

# Asked for rather than automatic, and that is about the quota rather than about caution: the
# free tier allows fifteen runs a day across everything, and this repository has merged more
# than that in a single afternoon. Triggering it by hand is also the shape the tool wants —
# start it, put the phone down, read the report when it is finished.
on:
  workflow_dispatch:

jobs:
  robo:
    name: Let the crawler loose on the app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # A job-level `if` reading `secrets` is what this used to be, and it is not valid: the
      # secrets context does not exist when job conditions are evaluated, so GitHub rejected the
      # whole file and reported a failed run against every push. Nothing ran, and the red mark
      # said nothing about the code.
      #
      # The check belongs in a step, where the context does exist. Failing rather than skipping,
      # because this workflow is only ever started by hand: someone who asks for a crawl and gets
      # a silent green has been told nothing.
      - name: Check the credentials are configured
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$KEY" || { echo "FIREBASE_SERVICE_ACCOUNT is not set"; exit 1; }
          test -n "$PROJECT" || { echo "FIREBASE_PROJECT_ID is not set"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Authenticate
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Written outside the workspace so no later step can archive it by accident.
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json"
          gcloud config set project "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Crawl
        run: |
          # Without pipefail the pipe swallows the exit code and reports tee's. The first real
          # run made that concrete: the crawl died on a 403 and the job finished green, which is
          # worse than no check at all.
          set -o pipefail
          # No device is named on purpose: model names are retired over time, and a run that
          # fails because a phone from three years ago is gone teaches nothing. Google's default
          # is maintained; --timeout keeps one crawl inside the free tier.
          gcloud firebase test android run \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --timeout 4m \
            --format='value(outcome)' 2>&1 | tee robo.log
          echo
          echo "The video, the screenshots and the logcat are in the Firebase console —"
          echo "the link is printed above, under 'Test results will be streamed to'."

      # The console holds everything and needs a Google login to see. What the crawler actually
      # found should be readable by whoever is looking at the run, so the results come back here
      # too. The bucket is not known in advance — Test Lab makes one per project — so it is read
      # out of the line gcloud prints when it starts.
      - name: Fetch what the crawler saw
        if: always()
        run: |
          set -o pipefail
          WHERE=$(sed -n 's#.*storage/browser/\([^]]*\)\].*#\1#p' robo.log | head -1)
          # The printed location already ends in a slash, and appending another made a path that
          # matched nothing at all — "No URLs matched" on a bucket with the results plainly in it.
          WHERE=${WHERE%/}
          test -n "$WHERE" || { echo "gcloud printed no results location"; exit 0; }
          echo "results at gs://$WHERE"
          mkdir -p robo
          # The video is tens of megabytes and says less than the stills; everything else comes.
          gsutil -m cp -r "gs://$WHERE" robo/ || true
          find robo -name '*.mp4' -delete
          find robo -type f | head -50

      - name: Upload what the crawler saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-results
          retention-days: 7
          path: robo/
          if-no-files-found: ignore

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"
